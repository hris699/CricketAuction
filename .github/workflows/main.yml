name: Manual OpenAPI Spectral & VulnAPI Report
on:
  workflow_dispatch:
jobs:
  spectral-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Spectral CLI
        run: npm install -g @stoplight/spectral-cli
      - name: Create report folder
        run: mkdir -p spectral-reports
      - name: Run Spectral report for Auction
        run: spectral lint Auction/auctionSwagger.yaml --format html --ruleset .spectral.yaml > spectral-reports/auction-report.html || true
      - name: Upload Spectral reports
        uses: actions/upload-artifact@v4
        with:
          name: spectral-reports
          path: spectral-reports/
  vulnapi-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create report folder
        run: mkdir -p vulnapi-reports
      - name: Run VulnAPI Scan for Auction
        uses: cerberauth/vulnapi-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          openapi: 'Auction/auctionSwagger.yaml'
          args: --reporter json --no-server-validation
      - name: Move VulnAPI report
        run: |
          if [ -f vulnapi-report.html ]; then
            mv vulnapi-report.html vulnapi-reports/auction-vulnapi-report.html
          elif [ -f report.html ]; then
            mv report.html vulnapi-reports/auction-vulnapi-report.html
          else
            echo "No report file found, creating placeholder"
            echo "<h1>VulnAPI Scan Completed</h1><p>Check GitHub Actions logs for details</p>" > vulnapi-reports/auction-vulnapi-report.html
          fi
      - name: Upload VulnAPI report
        uses: actions/upload-artifact@v4
        with:
          name: vulnapi-reports
          path: vulnapi-reports/
