jobs:
  vulnapi-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure Python and pip
        run: sudo apt-get update && sudo apt-get install -y python3-pip

      - name: Install VulnAPI CLI
        run: pip install vulnapi

      - name: Create report folder
        run: mkdir -p vulnapi-reports

      - name: Run VulnAPI scan (CLI)
        run: vulnapi -i Auction/auctionSwagger.yaml -o vulnapi-reports/auction-vulnapi-report.html || true

      - name: Upload VulnAPI reports
        uses: actions/upload-artifact@v4
        with:
          name: vulnapi-reports
          path: vulnapi-reports/
