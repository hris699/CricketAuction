name: Manual OpenAPI Spectral & VulnAPI Report

on:
  workflow_dispatch:

jobs:
  spectral-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Spectral CLI
        run: npm install -g @stoplight/spectral-cli

      - name: Create report folder
        run: mkdir -p spectral-reports

      - name: Run Spectral report for Auction
        run: spectral lint Auction/auctionSwagger.yaml --format html --ruleset .spectral.yaml > spectral-reports/auction-report.html || true

      - name: Upload Spectral reports
        uses: actions/upload-artifact@v4
        with:
          name: spectral-reports
          path: spectral-reports/

  vulnapi-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run VulnAPI Scan
        uses: vulnapi/vulnapi-action@v1
        with:
          input: Auction/auctionSwagger.yaml
          output: vulnapi-reports/auction-vulnapi-report.html
          format: html

      - name: Upload VulnAPI report
        uses: actions/upload-artifact@v4
        with:
          name: vulnapi-reports
          path: vulnapi-reports/
