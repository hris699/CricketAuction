extends:
  - "spectral:oas"

rules:
  # Require info.title for proper documentation
  info-title:
    description: "OpenAPI 'info.title' must be specified."
    severity: error
    given: "$.info.title"
    then:
      function: truthy

  # Require info.version for version tracking
  info-version:
    description: "OpenAPI 'info.version' must be specified."
    severity: error
    given: "$.info.version"
    then:
      function: truthy

  # Recommend providing contact information for support
  info-contact:
    description: "OpenAPI 'info.contact' is recommended."
    severity: warn
    given: "$.info.contact"
    then:
      function: truthy

  # Recommend providing a description for the API
  info-description:
    description: "OpenAPI 'info.description' is recommended."
    severity: warn
    given: "$.info.description"
    then:
      function: truthy

  # Each path should have operations defined
  path-has-operations:
    description: "Each path should have at least one HTTP operation."
    severity: error
    given: "$.paths[*]"
    then:
      function: length
      functionOptions:
        min: 1

  # Parameters should have descriptions
  param-description:
    description: "All parameters should have a description for clarity."
    severity: warn
    given: "$.paths[*][*].parameters[*]"
    then:
      field: "description"
      function: truthy

  # Success responses should be defined
  operation-success-response:
    description: "Operations should define at least one 2xx success response."
    severity: error
    given: "$.paths[*][*].responses"
    then:
      field: "200"
      function: truthy

  # Recommend providing 4xx error responses
  operation-4xx-response:
    description: "Operations should define at least one 4xx client error response."
    severity: warn
    given: "$.paths[*][*].responses"
    then:
      field: "400"
      function: truthy

  # Ensure security is considered
  operation-should-define-security:
    description: "Operations should define security requirements."
    severity: warn
    given: "$.paths[*][*]"
    then:
      field: "security"
      function: truthy

  # Path parameters must be defined
  path-parameters-defined:
    description: "Path parameters should be defined in the parameters section."
    severity: error
    given: "$.paths[*][*].parameters[?(@.in=='path')]"
    then:
      field: "name"
      function: truthy
