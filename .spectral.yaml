extends:
  - "spectral:oas"

rules:
  # You can add custom rules here or adjust built-in rules.
  # The following is the default recommended Spectral ruleset for OpenAPI files.

  # Require info.title
  info-title:
    description: "OpenAPI 'info.title' must be specified."
    message: "The info.title field is required."
    severity: error
    given: "$.info.title"
    then:
      function: truthy

  # Require info.version
  info-version:
    description: "OpenAPI 'info.version' must be specified."
    message: "The info.version field is required."
    severity: error
    given: "$.info.version"
    then:
      function: truthy

  # Recommend info.contact
  info-contact:
    description: "OpenAPI 'info.contact' is recommended."
    message: "Specifying a contact for the API is recommended."
    severity: warn
    given: "$.info.contact"
    then:
      function: truthy

  # Recommend info.description
  info-description:
    description: "OpenAPI 'info.description' is recommended."
    message: "Specifying a description for the API is recommended."
    severity: warn
    given: "$.info.description"
    then:
      function: truthy

  # Always define responses for each operation
  operation-4xx-response:
    description: "Operations should define at least one 4xx response."
    message: "Define at least one 4xx response for this operation."
    severity: warn
    given: "$.paths[*][*].responses"
    then:
      function: defined
      functionOptions:
        statusCodes: ["400", "401", "403", "404"]

  operation-success-response:
    description: "Operations should define a 2xx success response."
    message: "Define at least one 2xx success response for this operation."
    severity: error
    given: "$.paths[*][*].responses"
    then:
      function: defined
      functionOptions:
        statusCodes: ["200", "201", "202", "204"]

  # Path parameter names must always be used
  path-params-used:
    description: "All path parameters must be defined and referenced."
    message: "Unused path parameter detected."
    severity: error
    given: "$.paths[*].parameters[?(@.in=='path')]"
    then:
      function: defined

  # All parameters should have a description
  param-description:
    description: "All parameters must have a description."
    message: "Parameter description is required."
    severity: warn
    given: "$.paths[*][*].parameters[*]"
    then:
      field: "description"
      function: truthy
