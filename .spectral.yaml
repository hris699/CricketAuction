extends:
  - spectral:oas

rules:
  # Ensure only HTTPS in schemes (OAS2)
  oas2-schemes-https-only:
    description: 'API must only allow HTTPS.'
    given: $.schemes
    then:
      function: pattern
      functionOptions:
        match: '^https$'

  # Require security definitions (OAS2)
  oas2-require-security-definitions:
    description: 'API must define security definitions (authentication, etc).'
    given: $.
    severity: error
    then:
      field: securityDefinitions
      function: truthy

  # Operation should specify security
  oas2-operation-require-security:
    description: 'Each operation should specify security requirements.'
    given: $.paths.*.*
    severity: warn
    then:
      field: security
      function: truthy

  # Do not allow TRACE method
  no-trace-method:
    description: 'TRACE HTTP method should not be used—security risk.'
    given: $.paths[?(@.trace)]
    severity: error
    then:
      function: falsy
